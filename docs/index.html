<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cumpleaños para Google Calendar</title>
  <link rel="icon" href="icon128.png">
  <style>
    :root { --fg: #1f1f1f; --muted: #5f6368; --bg: #fff; --accent: #1a73e8; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8eaed; --muted: #9aa0a6; --bg: #202124; --accent: #8ab4f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 28px; margin: 16px 0 8px; line-height: 1.2; }
    p { color: var(--muted); margin: 0 0 24px; }
    nav { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <img src="icon128.png" alt="">
  <h1>Cumpleaños para Google Calendar</h1>
  <p>Extensión de Chrome: cargás un nombre y una fecha, y se crea en tu Google Calendar un evento anual con recordatorios.</p>
  <nav>
    <a href="privacy.html">Política de privacidad</a>
    <a href="https://github.com/smalirat/birthdays-alarms">Código en GitHub</a>
  </nav>
</main>
</body>
</html>
